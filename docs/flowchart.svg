<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150" role="img" aria-labelledby="title desc"><title id="title">ESP32 RFID bulb controller flowchart</title><desc id="desc">Startup initializes relay off and RFID, waits for a card, checks UID, and toggles relay only for authorized card.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><style>.bg{fill:#f8fafc}.title{font:700 26px Arial,sans-serif;fill:#0f172a}.sub{font:14px Arial,sans-serif;fill:#475569}.node{fill:#fff;stroke:#2563eb;stroke-width:2}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.safe{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.warn{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.txt{font:600 15px Arial,sans-serif;fill:#0f172a}.small{font:13px Arial,sans-serif;fill:#334155}.arrow{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.yes{font:700 13px Arial,sans-serif;fill:#15803d}.no{font:700 13px Arial,sans-serif;fill:#c2410c}</style><rect class="bg" width="1000" height="1150" rx="20"/><text x="500" y="48" text-anchor="middle" class="title">ESP32 RFID Bulb Controller — Flowchart</text><text x="500" y="74" text-anchor="middle" class="sub">Authorized-card logic and relay ON/OFF control</text>
<rect class="node" x="360" y="105" width="280" height="64" rx="32"/><text class="txt" x="500" y="144" text-anchor="middle">Start / power on</text>
<path class="arrow" d="M500 169 V205"/><rect class="node" x="300" y="205" width="400" height="76" rx="12"/><text class="txt" x="500" y="236" text-anchor="middle">Initialize GPIO, SPI and RFID</text><text class="small" x="500" y="258" text-anchor="middle">Command relay OFF at startup</text>
<path class="arrow" d="M500 281 V320"/><path class="decision" d="M500 320 L650 380 L500 440 L350 380 Z"/><text class="txt" x="500" y="375" text-anchor="middle">New card</text><text class="txt" x="500" y="395" text-anchor="middle">detected?</text>
<path class="arrow" d="M350 380 H170 V380 V320"/><text class="no" x="245" y="365" text-anchor="middle">No</text><path class="arrow" d="M170 320 V380"/><path class="arrow" d="M170 380 V1040 H370"/><text class="small" x="145" y="680" transform="rotate(-90 145 680)" text-anchor="middle">Continue scanning</text>
<path class="arrow" d="M500 440 V480"/><text class="yes" x="520" y="463">Yes</text><rect class="node" x="340" y="480" width="320" height="65" rx="12"/><text class="txt" x="500" y="507" text-anchor="middle">Read card UID</text><text class="small" x="500" y="528" text-anchor="middle">Print UID to Serial Monitor</text>
<path class="arrow" d="M500 545 V580"/><path class="decision" d="M500 580 L660 640 L500 700 L340 640 Z"/><text class="txt" x="500" y="635" text-anchor="middle">UID matches</text><text class="txt" x="500" y="655" text-anchor="middle">authorized UID?</text>
<path class="arrow" d="M340 640 H225 V740 H330"/><text class="no" x="280" y="625" text-anchor="middle">No</text><rect class="warn" x="330" y="710" width="340" height="70" rx="12"/><text class="txt" x="500" y="739" text-anchor="middle">Access denied</text><text class="small" x="500" y="760" text-anchor="middle">Keep relay state unchanged</text><path class="arrow" d="M670 745 H800 V1040 H630"/>
<path class="arrow" d="M500 700 V815"/><text class="yes" x="520" y="725">Yes</text><path class="decision" d="M500 815 L650 875 L500 935 L350 875 Z"/><text class="txt" x="500" y="870" text-anchor="middle">Relay currently</text><text class="txt" x="500" y="890" text-anchor="middle">ON?</text>
<path class="arrow" d="M350 875 H260 V965 H370"/><text class="yes" x="295" y="858" text-anchor="middle">Yes</text><path class="arrow" d="M650 875 H740 V965 H630"/><text class="no" x="705" y="858" text-anchor="middle">No</text><rect class="safe" x="300" y="965" width="170" height="60" rx="10"/><text class="txt" x="385" y="990" text-anchor="middle">Set relay OFF</text><text class="small" x="385" y="1010" text-anchor="middle">Bulb command OFF</text><rect class="safe" x="530" y="965" width="170" height="60" rx="10"/><text class="txt" x="615" y="990" text-anchor="middle">Set relay ON</text><text class="small" x="615" y="1010" text-anchor="middle">Bulb command ON</text><path class="arrow" d="M385 1025 V1040 H500"/><path class="arrow" d="M615 1025 V1040 H500"/><rect class="node" x="370" y="1040" width="260" height="58" rx="29"/><text class="txt" x="500" y="1075" text-anchor="middle">Wait, then scan again</text></svg>