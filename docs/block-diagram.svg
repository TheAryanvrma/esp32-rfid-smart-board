<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">ESP32 RFID bulb controller block diagram</title><desc id="desc">RFID reader sends each card UID to the ESP32, which toggles the relay output for authorized cards.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><style>.bg{fill:#f8fafc}.title{font:700 26px Arial,sans-serif;fill:#0f172a}.sub{font:14px Arial,sans-serif;fill:#475569}.node{fill:#fff;stroke:#2563eb;stroke-width:2}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.safe{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.warn{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.txt{font:600 15px Arial,sans-serif;fill:#0f172a}.small{font:13px Arial,sans-serif;fill:#334155}.arrow{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.yes{font:700 13px Arial,sans-serif;fill:#15803d}.no{font:700 13px Arial,sans-serif;fill:#c2410c}</style><rect class="bg" width="1100" height="680" rx="20"/><text x="550" y="48" text-anchor="middle" class="title">ESP32 RFID Bulb Controller — Block Diagram</text><text x="550" y="75" text-anchor="middle" class="sub">Low-voltage control and mains load are separate parts of the system</text>
<rect class="node" x="55" y="180" width="220" height="130" rx="14"/><text class="txt" x="165" y="220" text-anchor="middle">RFID Reader</text><text class="small" x="165" y="248" text-anchor="middle">MFRC522 / RC522</text><text class="small" x="165" y="272" text-anchor="middle">Reads card UID</text>
<path class="arrow" d="M275 245 H405"/><text class="small" x="340" y="228" text-anchor="middle">SPI</text>
<rect class="node" x="405" y="160" width="270" height="170" rx="14"/><text class="txt" x="540" y="205" text-anchor="middle">ESP32 Controller</text><text class="small" x="540" y="235" text-anchor="middle">Checks authorized UID</text><text class="small" x="540" y="260" text-anchor="middle">Toggles relay command</text><text class="small" x="540" y="285" text-anchor="middle">GPIO 26 → IN1</text>
<path class="arrow" d="M675 245 H805"/><text class="small" x="740" y="228" text-anchor="middle">GPIO control</text>
<rect class="node" x="805" y="180" width="235" height="130" rx="14"/><text class="txt" x="922" y="220" text-anchor="middle">Relay Module</text><text class="small" x="922" y="248" text-anchor="middle">5 V, active-LOW</text><text class="small" x="922" y="272" text-anchor="middle">Isolated contacts*</text>
<path class="arrow" d="M922 310 V390"/><text class="small" x="944" y="352">Switches</text>
<rect class="warn" x="805" y="390" width="235" height="105" rx="14"/><text class="txt" x="922" y="427" text-anchor="middle">AC Bulb Circuit</text><text class="small" x="922" y="453" text-anchor="middle">Mains load</text><text class="small" x="922" y="475" text-anchor="middle">Bulb follows relay contact state</text>
<rect class="safe" x="405" y="400" width="270" height="95" rx="14"/><text class="txt" x="540" y="438" text-anchor="middle">USB / DC Supply</text><text class="small" x="540" y="464" text-anchor="middle">Powers ESP32 and logic</text><path class="arrow" d="M540 400 V330"/>
<rect x="55" y="555" width="985" height="65" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text class="txt" x="547" y="582" text-anchor="middle">System overview</text><text class="small" x="547" y="603" text-anchor="middle">The ESP32 toggles the relay output ON and OFF for registered teacher cards.</text></svg>